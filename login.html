<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal - AwanNet</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        :root {
            --primary: #0056b3; 
            --secondary: #e9ecef; 
            --dark: #212529; 
            --accent: #fd7e14; 
            --white: #ffffff;
            --border: #ced4da;
        }
        body {
            background-color: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--dark);
        }

        .login-container {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 5px;
        }
        .logo span { color: var(--accent); }
        
        .login-header p {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
        }

        .btn-login {
            width: 100%;
            background-color: var(--primary);
            color: var(--white);
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background-color: #004494;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            font-size: 13px;
            color: #6c757d;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: var(--primary);
        }

        /* Notifikasi Error Simulasi */
        #error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <a href="index.html" class="logo">☁️ Awan<span>Net</span></a>
            <p>Portal Masuk Pelanggan & Teknisi</p>
        </div>

        <form id="loginForm">
            <div id="error-msg">Username atau Password salah!</div>

            <div class="form-group">
                <label>Username / ID Pelanggan</label>
                <input type="text" id="username" placeholder="Masukkan ID atau Username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Masuk</button>
        </form>

        <a href="index.html" class="back-link">⬅ Kembali ke Beranda</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            // Mengambil nilai input
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;

        
            if (user === 'admin') {
               
                window.location.href = 'dash-admin.html';
            } else if (user !== '') {
       
                window.location.href = 'dash-pelanggan.html';
            } else {
                // Tampilkan pesan error
                document.getElementById('error-msg').style.display = 'block';
            }
        });
    </script>

</body>
</html>
